name: prime-mobile-os tests
on:
  push:
    branches: [main]
    paths: ['prime-mobile-os/**']
  pull_request:
    paths: ['prime-mobile-os/**']
jobs:
  tests:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: prime-mobile-os } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: prime, POSTGRES_PASSWORD: prime, POSTGRES_DB: prime_mobile_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pgsql, gd, exif, intl, bcmath, zip' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: composer install --no-interaction --no-progress
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
        env: { DB_HOST: 127.0.0.1, DB_USERNAME: prime, DB_PASSWORD: prime }
