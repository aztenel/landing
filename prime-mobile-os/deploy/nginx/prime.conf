# Prime Mobile OS — nginx (architecture §6). Replace primemobile.kz with the real domain.
# Two PHP-FPM pools: «erp» (cash register, ERP) and «site» (public catalogue) — a flood on the site never slows the till.

limit_req_zone $binary_remote_addr zone=site:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name primemobile.kz www.primemobile.kz erp.primemobile.kz;
    return 301 https://$host$request_uri;
}

# ---------- ERP: erp.<домен> ----------
server {
    listen 443 ssl http2;
    server_name erp.primemobile.kz;
    ssl_certificate     /etc/letsencrypt/live/primemobile.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primemobile.kz/privkey.pem;

    root /var/www/prime/current/public;
    index index.php;
    client_max_body_size 30m;                       # iPhone photos up to 25 MB (TZ 05 §3.3)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location = /login { limit_req zone=login burst=10 nodelay; try_files $uri /index.php?$query_string; }
    location /build/  { expires 1y; access_log off; add_header Cache-Control "public, immutable"; }
    location /storage/ { expires 30d; access_log off; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/prime-erp.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }
    location ~ /\.(?!well-known) { deny all; }
}

# ---------- Site: <домен> ----------
server {
    listen 443 ssl http2;
    server_name primemobile.kz www.primemobile.kz;
    ssl_certificate     /etc/letsencrypt/live/primemobile.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primemobile.kz/privkey.pem;
    if ($host = www.primemobile.kz) { return 301 https://primemobile.kz$request_uri; }

    root /var/www/prime/current/public;
    index index.php;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location /build/   { expires 1y; access_log off; add_header Cache-Control "public, immutable"; }
    location /storage/site/ { expires 1y; access_log off; add_header Cache-Control "public, immutable"; }   # WebP photos with random names
    location /storage/ { deny all; }                 # nothing else of the storage is public on the site
    location / {
        limit_req zone=site burst=40 nodelay;
        try_files $uri /index.php?$query_string;
    }
    location ~ \.php$ {
        limit_req zone=site burst=40 nodelay;
        fastcgi_pass unix:/run/php/prime-site.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30;
    }
    location ~ /\.(?!well-known) { deny all; }
}
