; PHP-FPM pool «erp» — cash register and ERP (architecture §6). /etc/php/8.3/fpm/pool.d/prime-erp.conf
[prime-erp]
user = prime
group = www-data
listen = /run/php/prime-erp.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 120
php_admin_value[upload_max_filesize] = 26M
php_admin_value[post_max_size] = 60M
php_admin_value[memory_limit] = 512M
php_admin_value[expose_php] = Off
