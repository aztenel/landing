; Background workers (supervisor). /etc/supervisor/conf.d/prime.conf
[program:prime-queue]
command=/usr/bin/php /var/www/prime/current/artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
user=prime
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=60
stdout_logfile=/var/www/prime/shared/storage/logs/queue.log

; Outbox → site (sale leaves the site in ≤ 15 s, TZ 05 §8.3)
[program:prime-outbox]
command=/usr/bin/php /var/www/prime/current/artisan prime:outbox --loop --max-time=3600
user=prime
autostart=true
autorestart=true
stdout_logfile=/var/www/prime/shared/storage/logs/outbox.log
